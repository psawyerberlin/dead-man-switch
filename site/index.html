<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead man's switch</title>
<meta name="description" content="A letter that opens only if you stop checking in. English, français, Deutsch.">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="alternate" hreflang="en" href="https://dead-man-switch.chainsolution.net/en/">
<link rel="alternate" hreflang="fr" href="https://dead-man-switch.chainsolution.net/fr/">
<link rel="alternate" hreflang="de" href="https://dead-man-switch.chainsolution.net/de/">
<script>
  // Pick the visitor's language once; the choice on a language page is remembered by the pages' own links.
  (function () {
    try {
      var stored = localStorage.getItem('dms-lang');
      var langs = stored ? [stored] : (navigator.languages || [navigator.language || 'en']);
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).slice(0, 2).toLowerCase();
        if (l === 'fr' || l === 'de' || l === 'en') { location.replace('/' + l + '/'); return; }
      }
      location.replace('/en/');
    } catch (e) { location.replace('/en/'); }
  })();
</script>
</head>
<body>
<main class="choose">
  <div>
    <h1>Dead man's switch</h1>
    <p>A letter that opens only if you stop checking in.</p>
    <ul>
      <li><a href="/en/" lang="en">English</a></li>
      <li><a href="/fr/" lang="fr">Français</a></li>
      <li><a href="/de/" lang="de">Deutsch</a></li>
    </ul>
  </div>
</main>
</body>
</html>
